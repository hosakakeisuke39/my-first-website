
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #e2fff1;
      color: #334155;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px #000010;
    }
    header {
      background: #1e3a5f;
      color: white;
      padding: 40px;
    }
    header p { color: #dbeafe; }
    main { padding: 30px 40px; }
    section { margin-bottom: 30px; }
    h2 { color: #ff00ff; }
    .skills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .skill {
      background: #eff6ff;
      color: #2563eb;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .progress {
      height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
    }
    .progress-bar {
      width: 60%;
      height: 100%;
      background: #2563eb;
      border-radius: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    #message { display: none; }
    @media (max-width: 600px) {
      .container { margin: 12px; }
      header, main { padding: 24px; }
    }
    .project-card {
  border: 1px solid #dbeafe;
  background: #f8fafc;
  border-radius: 12px;
  padding: 20px;
}
.project-card h3 {
  margin-top: 0;
  color: #2563eb;
}
  </style>
  
</head>
<body>
  <div class="container">
    <header>
      <h1>こんにちは！</h1>
      <p>経済学とプログラミングを学ぶ大学生です。</p>
    </header>

    <main>
      <section>
        <h2>自己紹介</h2>
        <p>大学で経済学を学びながら、
        GitHubを使ったWeb開発に挑戦しています。</p>
      </section>

      <section>
        <h2>学習中のスキル</h2>
        <div class="skills">
          <span class="skill">HTML</span>
          <span class="skill">CSS</span>
          <span class="skill">GitHub</span>
          <span class="skill">VS Code</span>
          <span class="skill">Python</span>
        </div>
      </section>

      <section>
        <h2>学習の進捗</h2>
        <div class="progress">
          <div class="progress-bar"></div>
        </div>
        <p>GitHubの基礎を習得中</p>
      </section>
      <section class="projects">
  <h2>制作実績</h2>
  <div class="project-card">
    <h3>My First Website</h3>
    <p>HTML・CSS・JavaScriptで制作した、
    初めてのポートフォリオサイトです。</p>
    <p>GitHub Desktopで変更履歴を管理しています。</p>
  </div>
</section>

      <button onclick="showMessage()">
        メッセージを表示
      </button>
      <p id="message">ご覧いただきありがとうございます！</p>
    </main>
  </div>

  <script>
    function showMessage() {
      const message = document.getElementById("message");
      message.style.display =
        message.style.display === "block" ? "none" : "block";
    }
  </script>
</body>
</html>
