
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f5fa;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000010;
    }
    h1 { color: #2563eb; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My First Website</h1>
    <p>GitHub Pagesで初めてのWebサイトを公開しました！</p>
    <p>これからWeb開発を学んでいきます。</p>
    <button onclick="alert('ボタンが動きました！')">
      クリックしてみよう
    </button>
  </div>
</body>
</html>
